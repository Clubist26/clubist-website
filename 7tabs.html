<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>7 Tabs Open · Questionnaire</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0b0b'/%3E%3Ctext x='32' y='45' font-family='Arial' font-weight='700' font-size='38' fill='%23fff' text-anchor='middle'%3E7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0b0b; --grey:#8a8a8a; --mute:#b4b4b4; --line:#ececec; --soft:#f3f3f3;
  --card:#ffffff; --red:#ff3b30;
  --sans:"Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:#0d0d0d;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,textarea{font:inherit;color:inherit}

/* device frame */
.device{position:relative;width:min(1180px,calc(100vw - 48px));height:min(920px,calc(100vh - 48px));margin:24px auto;border-radius:46px;border:10px solid #2b2b2b;box-shadow:0 0 0 1px #3a3a3a,0 40px 120px rgba(0,0,0,.6);overflow:hidden;
  background:linear-gradient(100deg,#bdbdbd 0%,#dedede 28%,#f4f4f4 55%,#fafafa 100%);display:flex;flex-direction:column}
.device:before{content:"";position:absolute;inset:0;background:radial-gradient(1200px 600px at 0% 60%,rgba(0,0,0,.12),transparent 60%);pointer-events:none}

/* top bar */
.top{position:relative;z-index:5;display:flex;align-items:center;gap:18px;padding:22px 30px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
.mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.pill{flex:1;max-width:560px;margin-left:auto;height:52px;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 6px 24px rgba(0,0,0,.06);display:flex;align-items:center;padding:0 10px 0 22px;gap:10px;min-width:0}
.crumb{flex:1;font-family:var(--mono);font-size:13px;color:#5d5d5d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:500}
.pill svg{flex:none;width:34px;height:34px;padding:7px;color:#4a4a4a}
.iconbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:background .2s}
.iconbtn:hover{background:rgba(255,255,255,.6)}
.iconbtn svg{width:26px;height:26px}
.bell{position:relative}
.bell svg{width:34px;height:34px}
.badge{position:absolute;top:0;right:-2px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;border:3px solid #f6f6f6;transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .3s}
.badge.pop{transform:scale(1.35)}
.badge.zero{background:var(--ink)}
.bell.ring svg{animation:ring .7s ease}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}

/* stage */
.stage{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 30px 30px}
.tabs{display:flex;align-items:flex-end;gap:4px;padding:0 0 0 30px;overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;position:relative;display:flex;align-items:center;gap:9px;height:56px;padding:0 22px;border-radius:24px 24px 0 0;background:rgba(255,255,255,.42);color:#3d3d3d;font-weight:600;font-size:16px;letter-spacing:-.01em;transition:background .25s,color .25s}
.tab:hover{background:rgba(255,255,255,.7)}
.tab .tn{font-family:var(--mono);font-size:12px;color:#8d8d8d;font-weight:400}
.tab.on{background:var(--card);color:var(--ink);height:62px}
.tab.on:after{content:"";position:absolute;left:22px;right:22px;bottom:10px;height:3px;border-radius:3px;background:var(--ink)}
.tab .tk{width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.tab .tk svg{width:12px;height:12px}
.tab .tg{width:15px;height:15px;color:#777}
.tab.more{background:transparent;padding:0 16px}
.tab.more svg{width:20px;height:20px}

.card{position:relative;flex:1;min-height:0;background:var(--card);border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.04);display:flex;flex-direction:column;overflow:hidden}
.body{flex:1;min-height:0;overflow-y:auto;padding:44px 56px 30px;scrollbar-width:thin}
.foot{flex:none;display:flex;align-items:center;gap:12px;padding:16px 28px 22px 56px;border-top:1px solid var(--line);background:#fff}
.prog{flex:1;height:4px;border-radius:4px;background:var(--soft);overflow:hidden;margin-right:12px}
.prog i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.btn{height:52px;padding:0 26px;border-radius:999px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:10px;transition:transform .15s,background .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#262626}
.btn.ghost{background:var(--soft)}
.btn.ghost:hover{background:#e9e9e9}
.btn.text{padding:0 14px;color:var(--grey)}
.btn.text:hover{color:var(--ink)}
.btn .kbd{font-family:var(--mono);font-size:12px;opacity:.55;font-weight:400}
.btn[disabled]{opacity:.4;pointer-events:none}
.back{width:52px;padding:0;justify-content:center}
.back svg{width:20px;height:20px}

.enter{animation:enter .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* question */
.meta em{font-style:normal}
.meta{display:flex;justify-content:space-between;gap:16px;font-family:var(--mono);font-size:12.5px;color:var(--grey);margin-bottom:26px;text-transform:uppercase;letter-spacing:.04em}
.q{font-size:clamp(28px,3.4vw,46px);font-weight:700;letter-spacing:-.035em;line-height:1.04;max-width:20ch;max-width:880px}
.help{margin-top:14px;font-size:18px;color:var(--grey);max-width:680px;line-height:1.4}
.ans{margin-top:34px;max-width:880px}
.sub{margin:28px 0 12px;font-size:15px;font-weight:600;letter-spacing:-.01em}

.field{width:100%;border:0;outline:0;background:var(--soft);border-radius:20px;padding:20px 22px;font-size:18px;line-height:1.45;transition:background .2s,box-shadow .2s}
.field::placeholder{color:#a9a9a9}
.field:focus{background:#fff;box-shadow:0 0 0 2px var(--ink)}
textarea.field{min-height:150px;resize:vertical}
textarea.field.small{min-height:96px}

.opts{border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#fff}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:16px;width:100%;padding:13px 20px;text-align:left;border-top:1px solid var(--line);transition:background .15s}
.opts:not(.two) .opt:first-child{border-top:0}
.opts.two .opt:nth-child(-n+2){border-top:0}
.opts.two .opt:nth-child(even){border-left:1px solid var(--line)}
.opts.two .opt:last-child:nth-child(odd),.rows.handles .row:last-child:nth-child(odd){grid-column:span 2}
.opt:hover{background:#fafafa}
.ico{width:46px;height:46px;border-radius:50%;background:#f0f0f0;display:grid;place-items:center;color:var(--ink);transition:background .2s,color .2s,transform .2s}
.ico svg{width:17px;height:17px}
.opt.on .ico{background:var(--ink);color:#fff;transform:scale(1.04)}
.opt .lb{font-weight:600;font-size:18px;letter-spacing:-.015em}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--mute)}
.opt.on .k{color:var(--ink)}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sc{height:84px;border-radius:22px;background:var(--soft);font-size:30px;font-weight:700;letter-spacing:-.03em;transition:background .2s,color .2s,transform .15s}
.sc:hover{background:#e9e9e9}
.sc.on{background:var(--ink);color:#fff}
.scl{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:12.5px;color:var(--grey)}

.rows{border:1px solid var(--line);border-radius:24px;overflow:hidden}
.row{display:grid;grid-template-columns:46px 150px 1fr;align-items:center;gap:16px;padding:10px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row label{font-weight:600;font-size:16px}
.row .ico{font-family:var(--mono);font-size:12px;font-weight:500}
.row input{width:100%;border:0;outline:0;background:transparent;font-size:17px;padding:12px 0}
.row input::placeholder{color:#b8b8b8}
.row:focus-within{background:#fafafa}
.rows.handles{display:grid;grid-template-columns:1fr 1fr}
.rows.handles .row{grid-template-columns:46px 1fr;gap:14px}
.rows.handles .row:nth-child(-n+2){border-top:0}
.rows.handles .row:nth-child(even){border-left:1px solid var(--line)}
.hwrap{display:flex;flex-direction:column}
.hwrap small{font-size:12px;color:var(--grey);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.hwrap input{padding:2px 0 4px}
.row.seven{grid-template-columns:46px 1fr}
.row.people{grid-template-columns:46px 170px 1fr}
.row.people input.nm{font-weight:600}

/* intro screens */
.intro{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:start}
.big{font-size:clamp(110px,15vw,210px);font-weight:800;letter-spacing:-.07em;line-height:.8;margin-left:-6px}
.big.icon{display:flex;align-items:center;height:168px}
.big.icon svg{width:120px;height:120px}
.ititle{font-size:clamp(34px,4vw,56px);font-weight:700;letter-spacing:-.04em;line-height:1;margin-top:26px}
.iline{font-size:21px;color:#555;margin-top:16px;line-height:1.35;max-width:30ch}
.ifacts{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12.5px;padding:9px 14px;border-radius:999px;background:var(--soft);color:#555}
.peek{border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.06);background:#fff}
.peek-h{display:flex;gap:6px;padding:12px 12px 0;background:#f6f6f6}
.peek-h span{padding:12px 18px;border-radius:16px 16px 0 0;font-weight:600;font-size:14px;color:#666}
.peek-h span.on{background:#fff;color:var(--ink)}
.prow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:16px 20px;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .t{font-weight:600;font-size:15.5px;line-height:1.25;letter-spacing:-.01em}
.prow .s{font-size:13.5px;color:var(--grey);margin-top:3px}
.prow .m{font-family:var(--mono);font-size:12.5px;color:var(--mute)}
.prow .ico{width:44px;height:44px}

/* cover */
.cover{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;min-height:100%}
.kicker{font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--grey)}
.headline{font-size:clamp(44px,5.2vw,76px);font-weight:800;letter-spacing:-.055em;line-height:.92;margin-top:22px}
.headline span{color:#c2c2c2}
.lede{font-size:19px;line-height:1.45;color:#4d4d4d;margin-top:24px;max-width:46ch}
.promises{margin-top:28px;border:1px solid var(--line);border-radius:24px;overflow:hidden;max-width:520px}
.ctas{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.visual{position:relative;height:470px}
.gtab{position:absolute;width:330px;background:#fff;border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.05);overflow:hidden;animation:float 7s ease-in-out infinite}
.gtab .gh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.gtab .gh b{font-family:var(--mono);font-size:12px;color:var(--grey);font-weight:400}
.gtab .gh span{font-weight:700;font-size:15px;letter-spacing:-.01em}
.gtab .gh i{margin-left:auto;font-style:normal;color:#c4c4c4;font-size:18px;line-height:1}
.gtab .gb{padding:16px 18px;display:grid;gap:10px}
.gtab .gb u{display:block;height:9px;border-radius:9px;background:#efefef;text-decoration:none}
.bigbell{position:absolute;right:6px;top:-6px;width:118px;height:118px;border-radius:34px;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.14);display:grid;place-items:center;z-index:20;animation:float 6s ease-in-out infinite reverse}
.bigbell svg{width:60px;height:60px}
.bigbell .badge{top:10px;right:8px;min-width:38px;height:38px;font-size:19px;border-width:4px;border-color:#fff}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(var(--r,0deg))}}

/* review + done */
.endgrid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.status{margin-top:16px;font-size:15px;color:var(--grey);min-height:22px}
.status.err{color:var(--red)}
.fallback{margin-top:18px;padding:18px 20px;border-radius:20px;background:var(--soft);font-size:15px;line-height:1.45;display:none}
.fallback.show{display:block}
.fallback .ctas{margin-top:14px}

/* dropdown panel */
.panel{position:absolute;z-index:30;top:84px;right:24px;width:min(460px,calc(100% - 32px));background:#fff;border-radius:28px;box-shadow:0 30px 90px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.06);overflow:hidden;transform-origin:top right;transform:scale(.96) translateY(-8px);opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s}
.panel.open{transform:none;opacity:1;pointer-events:auto}
.panel .ph{display:flex;gap:6px;padding:12px 12px 0;background:#f4f4f4}
.panel .ph button{padding:13px 20px;border-radius:18px 18px 0 0;font-weight:600;font-size:15px;color:#666;position:relative}
.panel .ph button.on{background:#fff;color:var(--ink)}
.panel .ph button.on:after{content:"";position:absolute;left:20px;right:20px;bottom:6px;height:3px;border-radius:3px;background:var(--ink)}
.panel .list{max-height:min(520px,60vh);overflow-y:auto}
.panel .prow{width:100%;text-align:left;cursor:pointer}
.panel .prow:hover{background:#fafafa}
.scrim{position:absolute;inset:0;z-index:25;display:none}
.scrim.open{display:block}

/* toast */
.toast{position:absolute;z-index:40;top:22px;left:50%;width:min(420px,calc(100% - 32px));transform:translate(-50%,calc(-100% - 80px));visibility:hidden;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.2);display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;padding:14px 18px;transition:transform .5s cubic-bezier(.2,1.2,.3,1)}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast .ico{background:var(--ink);color:#fff}
.toast .t{font-weight:700;font-size:16px;letter-spacing:-.01em}
.toast .s{font-size:14px;color:var(--grey);margin-top:2px}
.toast .m{font-family:var(--mono);font-size:12px;color:var(--mute)}

@media (max-width:980px){
  .intro,.cover,.endgrid{grid-template-columns:1fr}
  .visual{height:300px;transform:scale(.72);transform-origin:top left;margin-bottom:-90px}
  .intro .peek{display:none}
}
@media (max-width:760px){
  html,body{height:100%;overflow:hidden;background:#f2f2f2}
  .device{width:100%;height:100vh;height:100dvh;margin:0;border:0;border-radius:0;box-shadow:none;background:linear-gradient(160deg,#d6d6d6 0%,#ececec 35%,#f7f7f7 100%)}
  .device:before{display:none}
  .top{padding:calc(10px + env(safe-area-inset-top)) 14px 8px;gap:10px}
  .brand .wm{display:none}
  .mark{width:36px;height:36px;border-radius:11px}
  .pill{height:40px;padding:0 14px;margin-left:0}
  .crumb{font-size:11px}
  .pill svg,#menuBtn{display:none}
  .iconbtn{width:40px;height:40px}
  .bell svg{width:28px;height:28px}
  .badge{min-width:22px;height:22px;font-size:12px;border-width:2px;top:-1px;right:-3px}
  .stage{padding:2px 8px calc(8px + env(safe-area-inset-bottom))}
  .tabs{padding-left:16px;gap:3px;scroll-padding:0 40px}
  .tab{height:42px;padding:0 14px;font-size:13.5px;border-radius:16px 16px 0 0;gap:7px}
  .tab .tn{font-size:10.5px}
  .tab.on{height:46px}
  .tab.on:after{left:14px;right:14px;bottom:7px;height:2.5px}
  .tab.more{display:none}
  .card{border-radius:22px}
  .body{padding:24px 20px 20px;-webkit-overflow-scrolling:touch}
  .foot{padding:10px 12px 12px 16px;gap:8px}
  .prog{margin-right:4px}
  .btn{height:50px;padding:0 22px;font-size:15.5px}
  .btn .kbd,.foot .chip{display:none}
  .btn.text{padding:0 10px}
  .back{width:50px;padding:0}
  .meta{font-size:11px;margin-bottom:16px}
  .meta em{display:none}
  .q{font-size:clamp(25px,7.4vw,30px);line-height:1.08;letter-spacing:-.03em}
  .help{font-size:15.5px;margin-top:10px}
  .ans{margin-top:22px}
  .sub{margin:22px 0 10px}
  .field{font-size:16.5px;padding:16px 18px;border-radius:18px}
  textarea.field{min-height:140px;resize:none}
  textarea.field.small{min-height:88px}
  .opts.two,.rows.handles{grid-template-columns:1fr}
  .opts.two .opt:nth-child(2),.rows.handles .row:nth-child(2){border-top:1px solid var(--line)}
  .opts.two .opt:nth-child(even),.rows.handles .row:nth-child(even){border-left:0}
  .opts.two .opt:last-child:nth-child(odd),.rows.handles .row:last-child:nth-child(odd){grid-column:auto}
  .opts,.rows{border-radius:20px}
  .opt{padding:9px 14px;gap:12px;grid-template-columns:38px 1fr;min-height:58px}
  .opt .k{display:none}
  .ico{width:38px;height:38px}
  .ico svg{width:15px;height:15px}
  .opt .lb{font-size:16px}
  .row,.rows.handles .row,.row.seven{grid-template-columns:38px 1fr;gap:12px;padding:8px 14px}
  .row label{display:none}
  .row input{font-size:16.5px;padding:10px 0}
  .hwrap input{padding:2px 0 4px}
  .row.people{grid-template-columns:38px 1fr;row-gap:0;padding:10px 14px}
  .row.people .ico{grid-row:span 2;align-self:start;margin-top:4px}
  .row.people input.nm{padding:6px 0 2px}
  .row.people input.tx{grid-column:2;padding:2px 0 8px;font-size:15.5px}
  .scale{gap:6px}
  .sc{height:60px;font-size:22px;border-radius:16px}
  .intro,.cover,.endgrid{gap:22px}
  .cover{min-height:0;align-content:start}
  .kicker{font-size:11px}
  .headline{font-size:clamp(38px,11.5vw,46px);margin-top:14px;line-height:.95}
  .lede{font-size:16px;margin-top:16px}
  .promises{margin-top:20px;border-radius:20px}
  .promises .prow{padding:12px 14px;grid-template-columns:38px 1fr;gap:12px}
  .promises .prow .m{display:none}
  .prow .t{font-size:15px}.prow .s{font-size:13px}
  .visual{display:none}
  .big{font-size:clamp(96px,30vw,128px);margin-left:-4px}
  .big.icon{height:100px}.big.icon svg{width:80px;height:80px}
  .ititle{font-size:clamp(30px,9vw,38px);margin-top:18px}
  .iline{font-size:17px}
  .ifacts{margin-top:18px}
  .chip{font-size:11.5px;padding:8px 12px}
  .peek{display:none}
  .endgrid .peek{display:block;border-radius:20px;box-shadow:none}
  .endgrid .peek .prow{padding:12px 14px;grid-template-columns:38px 1fr auto;gap:12px}

/* ---------- build steps ---------- */

const REVIEW = steps.length;
steps.push({k:"review"});

/* ---------- state ---------- */
let A = {}, closed = [], idx = 0, sent = false, filter = "all";
try { const d = JSON.parse(localStorage.getItem(STORE) || "null"); if(d){ A = d.A || {}; closed = d.closed || []; sent = !!d.sent; d._idx = d.idx || 0; window.__saved = d; } } catch(e){}

const hasSaved = () => Object.keys(A).some(k => filled(A[k]));

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = x => String(x).padStart(2,"0");
function filled(v){
  if(v == null) return false;
  if(typeof v === "string") return v.trim() !== "";
  if(typeof v === "number") return true;
  if(Array.isArray(v)) return v.some(x => typeof x === "object" && x ? Object.values(x).some(filled) : filled(x));
  if(typeof v === "object") return Object.values(v).some(filled);
  return false;
}
const answered = q => filled(A[q.id]) || filled(A[q.id+"_more"]) || filled(A[q.id+"_also"]);
const secDone = s => s.qs.filter(answered).length;
const openCount = () => MAIN.filter(s => !closed.includes(s.key)).length;

/* ---------- top bar ---------- */
function setCrumb(st){

  if(closed.includes(s.key)) return `<span class="tk">${CHECK}</span>`;

  return `<span class="tn">${s.num}</span>`;
}
function renderTabs(st){
  const cur = st.s ? st.s.key : st.k;
  let h = `<button class="tab ${cur==="cover"?"on":""}" data-go="0">Start</button>`;
  VS.forEach(s => { h += `<button class="tab ${cur===s.key?"on":""}" data-go="${introAt[s.key]}">${tabGlyph(s)}${esc(s.tab)}</button>`; });

/* ---------- screens ---------- */
function render(){
  const st = steps[idx];

  const body = $("#body"), foot = $("#foot");

function renderCover(body, foot){
  const fan = MAIN.slice().reverse().map((s,i) => {
    const k = MAIN.length - 1 - i;
    return `<div class="gtab" style="top:${30 + k*46}px;left:${k*20}px;z-index:${k+1};--r:${(k%2? -1:1)*(1.2 + k*.3)}deg;animation-delay:${-k*.6}s">

      <div class="gb"><u style="width:${88 - k*4}%"></u><u style="width:${62 + k*3}%"></u></div></div>`;
  }).join("");
  body.innerHTML = `<div class="cover">
    <div>
      <div class="kicker">A questionnaire for the seven of you</div>
      <h1 class="headline">Seven women.<br>Seven lives.<br><span>A lot of tabs open.</span></h1>

      <div class="promises">
        ${prow(LOCK.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="17" height="17"'), "Only we read this", "Nothing you write is shared with the group.", "", true)}

        ${prow(SAVE, "Saves as you go", "Close it and pick up where you left off on this device.", "")}

    (hasSaved() ? `<button class="btn text" id="restart">Start again</button><button class="btn dark" id="resume">Pick up where you left off <span class="kbd">↵</span></button>`
                : `<button class="btn dark" id="begin">Open tab ${VS[0].num} <span class="kbd">↵</span></button>`);
  const b = $("#begin"); if(b) b.onclick = () => go(1);

function confirmReset(){ const el = $("#restart"); if(el.dataset.sure){ return true; } el.dataset.sure = 1; el.textContent = "Tap again to clear your answers"; return false; }

function prow(icon, t, s, m, dark){

function renderIntro(s, body, foot){

      <h2 class="ititle">${esc(s.title)}</h2>
      <p class="iline">${esc(s.intro)}</p>
      <div class="ifacts"><span class="chip">${s.qs.length} questions</span><span class="chip">About ${mins} minutes</span>${secDone(s) ? `<span class="chip">${secDone(s)} answered</span>` : ""}</div>
    </div>
    <div class="peek"><div class="peek-h"><span class="on">${esc(label)}</span><span>Q${pad(s.qs[0].n)} to Q${pad(s.qs[s.qs.length-1].n)}</span></div>${peek}${more}</div>
  </div>`;
  foot.innerHTML = `<button class="btn ghost back" id="prev" aria-label="Back">${ARROW_L}</button><div class="prog"><i style="width:${progressPct()}%"></i></div><button class="btn dark" id="next">Open ${s.main ? "tab " + s.num : "this tab"} <span class="kbd">↵</span></button>`;
  wireFoot();
}

function progressPct(){ return Math.round(steps.slice(0, idx+1).filter(x => x.k === "q").length / TOTAL * 100); }

function renderQ(st, body, foot){
  const {s, q} = st;
  const pos = s.qs.indexOf(q) + 1;
  const last = pos === s.qs.length;
  body.innerHTML = `<div>
    <div class="meta"><span>${s.main ? "Tab " + s.num + "<em> · </em>" : ""}<em>${esc(s.title)}</em></span><span>Q${pad(q.n)} / ${TOTAL}</span></div>
    <h2 class="q">${esc(q.q)}</h2>
    ${q.h ? `<p class="help">${esc(q.h)}</p>` : ""}
    <div class="ans" id="ans"></div>
  </div>`;
  renderAnswer(q, $("#ans"));
  const closeLabel = s.main ? `Close tab ${s.num}` : "Close this tab";
  foot.innerHTML = `<button class="btn ghost back" id="prev" aria-label="Back">${ARROW_L}</button>
    <div class="prog"><i style="width:${progressPct()}%"></i></div>
    <button class="btn text" id="skip">Skip</button>
    <button class="btn dark" id="next">${last ? closeLabel : "Continue"} <span class="kbd">↵</span></button>`;
  wireFoot();
  const first = body.querySelector("input,textarea");
  if(first && window.matchMedia("(min-width:761px)").matches) setTimeout(() => first.focus({preventScroll:true}), 60);
}

function optsHTML(list, sel, multi, key){
  const two = list.length > 6 ? " two" : "";
  return `<div class="opts${two}" data-key="${key}" data-multi="${multi?1:0}">` + list.map((o,i) => {
    const on = multi ? (sel || []).includes(o) : sel === o;
    const glyph = on ? CHECK : G[i % G.length];
    return `<button class="opt ${on?"on":""}" data-v="${esc(o)}"><span class="ico">${glyph}</span><span class="lb">${esc(o)}</span><span class="k">${String.fromCharCode(65+i)}</span></button>`;
  }).join("") + `</div>`;
}

function renderAnswer(q, el){
  let h = "";
  const v = A[q.id];
  if(q.t === "short") h = `<input class="field" data-bind="${q.id}" placeholder="${esc(q.ph || "Type here")}" value="${esc(v || "")}">`;
  else if(q.t === "long") h = `<textarea class="field" data-bind="${q.id}" placeholder="${esc(q.ph || "Take your time")}">${esc(v || "")}</textarea>`;
  else if(q.t === "single") h = optsHTML(q.o, v, false, q.id);
  else if(q.t === "multi") h = optsHTML(q.o, v, true, q.id);
  else if(q.t === "scale") h = `<div class="scale" data-key="${q.id}">${[1,2,3,4,5].map(x => `<button class="sc ${v===x?"on":""}" data-v="${x}">${x}</button>`).join("")}</div><div class="scl"><span>${esc(q.lo)}</span><span>${esc(q.hi)}</span></div>`;
  else if(q.t === "handles"){
    const o = v || {};
    h = `<div class="rows handles">` + HANDLES.map(([ab,name]) => `<div class="row"><span class="ico">${ab}</span><div class="hwrap"><small>${name}</small><input data-obj="${q.id}" data-f="${name}" placeholder="${name === "Other" ? "Platform and @handle" : "@handle"}" value="${esc(o[name] || "")}" autocapitalize="off" autocorrect="off" spellcheck="false"></div></div>`).join("") + `</div>`;
  }
  else if(q.t === "seven"){
    const a = v || [];
    h = `<div class="rows">` + [0,1,2,3,4,5,6].map(i => `<div class="row seven"><span class="ico">${pad(i+1)}</span><input data-arr="${q.id}" data-i="${i}" placeholder="Tab ${i+1}" value="${esc(a[i] || "")}"></div>`).join("") + `</div>`;
  }
  else if(q.t === "people"){
    const a = v || [];
    h = `<div class="rows">` + [0,1,2,3,4,5].map(i => { const r = a[i] || {}; return `<div class="row people"><span class="ico">${G[i % G.length]}</span><input class="nm" data-ppl="${q.id}" data-i="${i}" data-f="name" placeholder="Her name" value="${esc(r.name || "")}"><input class="tx" data-ppl="${q.id}" data-i="${i}" data-f="text" placeholder="${esc(q.ph)}" value="${esc(r.text || "")}"></div>`; }).join("") + `</div>`;
  }
  else if(q.t === "pick"){
    const list = names();
    h = list.length ? optsHTML(list, v, false, q.id)
      : `<input class="field" data-bind="${q.id}" placeholder="Her name" value="${esc(v || "")}">`;
  }
  if(q.also) h += `<div class="sub">${esc(q.also.q)}</div>` + optsHTML(q.also.o, A[q.id+"_also"], false, q.id+"_also");
  if(q.more) h += `<div class="sub">${esc(q.more)}</div><textarea class="field small" data-bind="${q.id}_more" placeholder="Optional">${esc(A[q.id+"_more"] || "")}</textarea>`;
  el.innerHTML = h;

  el.querySelectorAll("[data-bind]").forEach(i => i.addEventListener("input", () => { A[i.dataset.bind] = i.value; save(); }));
  el.querySelectorAll("[data-obj]").forEach(i => i.addEventListener("input", () => { const o = A[i.dataset.obj] = A[i.dataset.obj] || {}; o[i.dataset.f] = i.value; save(); }));
  el.querySelectorAll("[data-arr]").forEach(i => i.addEventListener("input", () => { const a = A[i.dataset.arr] = A[i.dataset.arr] || []; a[+i.dataset.i] = i.value; save(); }));
  el.querySelectorAll("[data-ppl]").forEach(i => i.addEventListener("input", () => { const a = A[i.dataset.ppl] = A[i.dataset.ppl] || []; const r = a[+i.dataset.i] = a[+i.dataset.i] || {}; r[i.dataset.f] = i.value; save(); }));
  el.querySelectorAll(".opts").forEach(box => box.addEventListener("click", e => {
    const b = e.target.closest(".opt"); if(!b) return;
    pickOpt(q, box, b.dataset.v);
  }));
  const sc = el.querySelector(".scale");
  if(sc) sc.addEventListener("click", e => { const b = e.target.closest(".sc"); if(!b) return; const x = +b.dataset.v; A[q.id] = A[q.id] === x ? undefined : x; save(); sc.querySelectorAll(".sc").forEach(c => c.classList.toggle("on", +c.dataset.v === A[q.id])); });
}

function pickOpt(q, box, val){
  const key = box.dataset.key, multi = box.dataset.multi === "1";
  if(multi){ const a = A[key] = A[key] || []; const i = a.indexOf(val); i < 0 ? a.push(val) : a.splice(i,1); }
  else A[key] = A[key] === val ? undefined : val;
  save();
  box.querySelectorAll(".opt").forEach((b,i) => {
    const on = multi ? (A[key] || []).includes(b.dataset.v) : A[key] === b.dataset.v;
    b.classList.toggle("on", on);
    b.querySelector(".ico").innerHTML = on ? CHECK : G[i % G.length];
  });
  const simple = (q.t === "single" || q.t === "pick") && !q.also && !q.more && key === q.id;
  if(simple && A[key] !== undefined) setTimeout(() => { if(steps[idx].q === q) next(); }, 380);
}

function renderReview(body, foot){
  const rows = VS.map((s,i) => prow(closed.includes(s.key) ? CHECK : G[i % G.length], (s.main ? "Tab " + s.num + " · " : "") + esc(s.title), `${secDone(s)} of ${s.qs.length} answered`, closed.includes(s.key) ? "Closed" : "Open", closed.includes(s.key))).join("");
  const total = VS.reduce((t,s) => t + secDone(s), 0);
  const c = openCount();
  body.innerHTML = `<div class="endgrid">
    <div>
      <div class="kicker">Nearly there${firstName() ? ", " + esc(firstName()) : ""}</div>
      <h1 class="headline">${c === 0 ? "Every tab<br>closed." : "Ready when<br>you are."}</h1>
      <p class="lede">You've answered ${total} of ${TOTAL}. ${c ? "There are still " + c + " tab" + (c>1?"s":"") + " open, but you can send what you have and add more in a chat with us later." : "Send it over and we'll start building 7 Tabs Open around the seven of you."}</p>
      <div class="ctas"><button class="btn dark" id="send">Send my answers <span class="kbd">↵</span></button></div>
      <div class="status" id="status"></div>
      <div class="fallback" id="fallback">It didn't go through. Download your answers and send the file to Charlie on WhatsApp instead.<div class="ctas"><button class="btn dark" id="dl">Download my answers</button><button class="btn ghost" id="retry">Try again</button></div></div>
    </div>
    <div class="peek"><div class="peek-h"><span class="on">All tabs</span><span>${MAIN.length - c} of ${MAIN.length} closed</span></div>${rows}</div>
  </div>`;
  foot.innerHTML = `<button class="btn ghost back" id="prev" aria-label="Back">${ARROW_L}</button><div class="prog"><i style="width:100%"></i></div><span class="chip">Your answers are saved on this device</span>`;
  $("#prev").onclick = prev;
  $("#send").onclick = send;
  $("#retry").onclick = send;
  $("#dl").onclick = download;
  body.querySelectorAll(".peek .prow").forEach((r,i) => { r.style.cursor = "pointer"; r.onclick = () => go(introAt[VS[i].key]); });
}

function renderDone(){
  const body = $("#body");
  body.innerHTML = `<div class="endgrid">
    <div>
      <div class="kicker">Sent${firstName() ? " · thank you, " + esc(firstName()) : ""}</div>
      <h1 class="headline">That's every<br>tab closed.</h1>
      <p class="lede">Your answers are in. Once all seven are in, we start building 7 Tabs Open around you. We'll be in touch with what comes next.</p>
      <div class="ctas"><button class="btn ghost" id="dl">Download a copy</button><button class="btn text" id="edit">Change an answer</button></div>
    </div>
    <div class="visual" aria-hidden="true" style="height:300px"><div class="bigbell" style="left:0;right:auto;top:10px;width:150px;height:150px;border-radius:44px">${BELL}<span class="badge zero">0</span></div></div>
  </div>`;
  body.firstElementChild.classList.add("enter");
  $("#foot").innerHTML = `<div class="prog"><i style="width:100%"></i></div><span class="chip">7 Tabs Open</span>`;
  $("#dl").onclick = download;
  $("#edit").onclick = () => { sent = false; save(); go(1); };
}

/* ---------- navigation ---------- */
function wireFoot(){
  const p = $("#prev"), nx = $("#next"), sk = $("#skip");
  if(p) p.onclick = prev;
  if(nx) nx.onclick = next;
  if(sk) sk.onclick = next;
}
function go(i){ idx = Math.max(0, Math.min(i, steps.length - 1)); save(); render(); closePanel(); }
function prev(){ go(idx - 1); }
function next(){
  const st = steps[idx];
  if(st.k === "review") return send();
  if(st.k === "q"){
    const nx = steps[idx + 1];
    if(!nx || nx.s !== st.s) closeTab(st.s);
  }
  go(idx + 1);
}
function closeTab(s){
  if(closed.includes(s.key)) return;
  closed.push(s.key); save();
  if(!s.main) return;
  const c = openCount();
  setBadge(true);
  toast(`Tab ${s.num} closed`, c ? `${c} tab${c>1?"s":""} still open` : "Every tab closed", s.num);
}
let toastT;
function toast(t, s, m){
  const el = $("#toast");
  el.innerHTML = `<span class="ico">${CHECK}</span><div><div class="t">${esc(t)}</div><div class="s">${esc(s)}</div></div><span class="m">now</span>`;
  el.classList.add("show"); clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove("show"), 2800);
}

/* ---------- panel ---------- */
function openPanel(){
  const head = ["all","open","closed"].map(f => `<button class="${filter===f?"on":""}" data-f="${f}">${f[0].toUpperCase() + f.slice(1)}</button>`).join("");
  $("#panelHead").innerHTML = head;
  const list = VS.filter(s => filter === "all" || (filter === "open") === !closed.includes(s.key));
  $("#panelList").innerHTML = list.length ? list.map((s,i) => {
    const c = closed.includes(s.key);
    return `<button class="prow" data-go="${introAt[s.key]}"><span class="ico" ${c?'style="background:#0b0b0b;color:#fff"':""}>${c ? CHECK : (s.icon==="lock" ? LOCK.replace('viewBox','width="17" height="17" viewBox') : G[i % G.length])}</span><div><div class="t">${s.main ? "Tab " + s.num + " · " : ""}${esc(s.title)}</div><div class="s">${secDone(s)} of ${s.qs.length} answered</div></div><span class="m">${c ? "Closed" : "Open"}</span></button>`;
  }).join("") : `<div class="prow"><span class="ico">${CHECK}</span><div><div class="t">Nothing here</div><div class="s">${filter === "open" ? "Every tab is closed." : "No tabs closed yet."}</div></div><span class="m"></span></div>`;
  $("#panel").classList.add("open"); $("#scrim").classList.add("open");
}
function closePanel(){ $("#panel").classList.remove("open"); $("#scrim").classList.remove("open"); }
$("#bellBtn").onclick = () => $("#panel").classList.contains("open") ? closePanel() : openPanel();
$("#menuBtn").onclick = $("#bellBtn").onclick;
$("#scrim").onclick = closePanel;
$("#panelHead").onclick = e => { const b = e.target.closest("button"); if(b){ filter = b.dataset.f; openPanel(); } };
$("#panelList").onclick = e => { const b = e.target.closest("[data-go]"); if(b) go(+b.dataset.go); };
$("#tabs").onclick = e => { const b = e.target.closest(".tab"); if(!b) return; if(b.dataset.panel) return openPanel(); go(+b.dataset.go); };

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if(e.key === "Escape") return closePanel();
  const tag = (e.target.tagName || "").toLowerCase();
  if(e.key === "Enter" && !e.shiftKey){
    if(tag === "button") return;
    if(tag === "textarea" && !(e.metaKey || e.ctrlKey)) return;
    e.preventDefault(); const st = steps[idx];
    if(st.k === "cover"){ const b = $("#begin") || $("#resume"); if(b) b.click(); return; }
    return next();
  }
  if(tag === "input" || tag === "textarea" || e.metaKey || e.ctrlKey || e.altKey) return;
  const st = steps[idx];
  if(st.k === "q" && /^[a-z]$/i.test(e.key)){
    const box = $("#ans .opts"); if(!box) return;
    const b = box.querySelectorAll(".opt")[e.key.toUpperCase().charCodeAt(0) - 65];
    if(b) pickOpt(st.q, box, b.dataset.v);
  }
  if(st.k === "q" && /^[1-5]$/.test(e.key)){ const b = $(`#ans .sc[data-v="${e.key}"]`); if(b) b.click(); }
});

/* ---------- sending ---------- */
function answerText(q){
  const v = A[q.id], out = [];
  if(filled(v)){
    if(q.t === "handles") out.push(Object.entries(v).filter(([,x]) => filled(x)).map(([k,x]) => `${k}: ${x.trim()}`).join("\n"));
    else if(q.t === "seven") out.push(v.map((x,i) => filled(x) ? `${i+1}. ${x.trim()}` : "").filter(Boolean).join("\n"));
    else if(q.t === "people") out.push(v.filter(r => r && filled(r)).map(r => `${(r.name||"?").trim()}: ${(r.text||"").trim()}`).join("\n"));
    else if(q.t === "scale") out.push(`${v} out of 5 (1 = ${q.lo}, 5 = ${q.hi})`);
    else if(Array.isArray(v)) out.push(v.join(", "));
    else out.push(String(v).trim());
  }
  if(q.also && filled(A[q.id+"_also"])) out.push(`${q.also.q} ${A[q.id+"_also"]}`);
  if(q.more && filled(A[q.id+"_more"])) out.push(`${q.more} ${A[q.id+"_more"].trim()}`);
  return out.join("\n");
}
function allAnswers(){
  const list = [];
  VS.forEach(s => s.qs.forEach(q => { const t = answerText(q); if(t) list.push({label:`T${s.num} Q${pad(q.n)} · ${q.q}`, text:t, s}); }));
  return list;
}
async function send(){
  const btn = $("#send"), st = $("#status");
  if(btn) btn.disabled = true;
  st.className = "status"; st.textContent = "Sending...";
  $("#fallback").classList.remove("show");
  const who = (A.name || "").trim() || "No name given";
  const answers = [];
  VS.forEach(s => s.qs.forEach(q => answers.push({
    key: `${s.num} · ${q.q}`,
    tab: s.main ? `Tab ${s.num} · ${s.title}` : s.title,
    q: q.q,
    a: answerText(q)
  })));
  const payload = { name: who, answered: answers.filter(x => x.a).length, total: TOTAL, answers };
  try{
    if(!SHEET_URL) throw new Error("No sheet URL");
    await fetch(SHEET_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload) });
    MAIN.forEach(s => { if(!closed.includes(s.key)) closed.push(s.key); });
    sent = true; save(); setBadge(true); renderDone();
  }catch(err){
    st.className = "status err"; st.textContent = "Something went wrong sending your answers.";
    $("#fallback").classList.add("show");
    if(btn) btn.disabled = false;
  }
}
function download(){
  const who = (A.name || "").trim() || "Unnamed";
  let txt = `7 TABS OPEN · QUESTIONNAIRE\n${who}\n\n`;
  let cur = "";
  allAnswers().forEach(a => {
    if(a.s.key !== cur){ cur = a.s.key; txt += `\n=== ${a.s.main ? "TAB " + a.s.num + " · " : ""}${a.s.title.toUpperCase()} ===\n\n`; }
    txt += `${a.label.replace(/^T\d+ /,"")}\n${a.text}\n\n`;
  });
  const blob = new Blob([txt], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `7-tabs-open-${who.toLowerCase().replace(/[^a-z0-9]+/g,"-")}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- go ---------- */
if(sent) idx = REVIEW;
render();
</script>
</body>
</html>
